<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">

   <link rel="stylesheet" href="reset.css">
   <link rel="stylesheet" href="index.css">

   <script src="index.js" defer></script>

   <title>Tic-Tac-Toe</title>

</head>
<body>
   
   <main>

      <h1>Tic Tac Toe</h1>

      <ul class="opponent-select">
         <li class="human selected">
            <span class="icon">👥</span>
            <span>2 Players</span>
         </li>
         <li class="computer">
            <span class="icon">🤖</span>
            vs AI
         </li>
      </ul>

      <ul class="scoreboard">
         <li class="player">
            <span class="player-name">Player X</span>
            <span class="player-score">0</span>
         </li>
         <li class="player">
            <span class="player-name">Player O</span>
            <span class="player-score">0</span>
         </li>
      </ul>

      <p class="current-player">Turn: X</p>

      <ul class="game-board">
         <li></li>
         <li></li>
         <li></li>
         <li></li>
         <li></li>
         <li></li>
         <li></li>
         <li></li>
         <li></li>
      </ul>

      <button class="restart">Restart Game</button>

   </main>

   <footer>
      <p>Created by <a href="https://jon.blue">Jonathan Blue</a></p>
   </footer>

</body>
</html>
